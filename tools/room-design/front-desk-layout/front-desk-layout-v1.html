<section id="front-desk-layout-proof" aria-labelledby="fd-title">
  <style>
    #front-desk-layout-proof{max-width:960px;margin-inline:auto}#front-desk-layout-proof .fd-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(250px,.8fr);gap:20px;align-items:start;margin-top:14px}#front-desk-layout-proof .fd-map-wrap{min-width:0}#front-desk-layout-proof .fd-map{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));grid-template-rows:repeat(4,minmax(42px,1fr));max-width:520px;aspect-ratio:5/4;margin:auto;position:relative;background:var(--muted)}
    #front-desk-layout-proof .fd-tile{min-width:0;min-height:0;background:var(--background);border:2px solid var(--border);display:flex;align-items:start;padding:3px;color:var(--muted-foreground);font-size:var(--font-size-small)}#front-desk-layout-proof .fd-tile.route{box-shadow:inset 0 0 0 3px var(--primary);background:var(--accent)}#front-desk-layout-proof .fd-tile.door-north{border-top:6px solid transparent}#front-desk-layout-proof .fd-tile.door-west{border-left:6px solid transparent}#front-desk-layout-proof .fd-tile.door-east{border-right:6px solid transparent}#front-desk-layout-proof .fd-tile.entry{border-bottom:6px solid transparent}
    #front-desk-layout-proof .fd-solid,#front-desk-layout-proof .fd-optional{z-index:2;align-self:stretch;justify-self:stretch;margin:0;border-radius:var(--radius-sm);padding:4px;min-width:0;text-align:center;display:flex;align-items:center;justify-content:center;font-size:var(--font-size-small);line-height:1.15}#front-desk-layout-proof .fd-solid{background:var(--secondary);outline:2px solid var(--foreground);color:var(--foreground);font-weight:var(--font-weight-medium)}#front-desk-layout-proof .fd-solid.desk{border-radius:0;outline-offset:-2px}#front-desk-layout-proof .fd-optional{background:var(--accent);color:var(--accent-foreground);outline:1px dashed var(--primary);font-size:11px}#front-desk-layout-proof .fd-hidden{display:none}
    #front-desk-layout-proof fieldset{border:0;margin:0 0 10px;padding:0}#front-desk-layout-proof legend{font-weight:var(--font-weight-medium);margin-bottom:4px}#front-desk-layout-proof .fd-controls{display:flex;gap:5px;flex-wrap:wrap}#front-desk-layout-proof .fd-status{margin-top:12px;border-left:3px solid var(--primary);padding-left:10px;min-height:3.5em}#front-desk-layout-proof .fd-key{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted-foreground)}#front-desk-layout-proof .fd-key b{color:var(--foreground)}#front-desk-layout-proof .fd-entry-label{z-index:3;align-self:end;justify-self:center;margin-bottom:3px;color:var(--primary);font-size:var(--font-size-small);font-weight:var(--font-weight-medium);pointer-events:none}
    @media(max-width:600px){#front-desk-layout-proof .fd-layout{grid-template-columns:1fr}#front-desk-layout-proof .fd-controls .btn{min-width:2.85rem;font-size:var(--font-size-small)}#front-desk-layout-proof .fd-map{max-width:100%}}
  </style>
  <h2 id="fd-title">Front Desk layout proof</h2>
  <p class="text-small text-muted">5 × 4 tile schematic: doors, solid furniture, optional-item visibility, and cardinal chair directions.</p>
  <div class="fd-layout">
    <div class="fd-map-wrap">
      <div id="fd-map" class="fd-map" role="img" aria-label="Five by four Front Desk floor plan. Route marks lead from fixed D3 sidewalk entry to the selected wall segment. Desk and chairs are permanent solids."></div>
      <div class="fd-key text-small"><span><b>Solid</b> desk, R↓ receptionist, V↑ visitor</span><span><b>Optional</b> nonblocking, door-hidden group</span><span><b>Route</b> selected door approach</span></div>
    </div>
    <div>
      <fieldset><legend>North segments</legend><div id="fd-north" class="fd-controls" aria-label="North door toggles"></div></fieldset>
      <fieldset><legend>West segments</legend><div id="fd-west" class="fd-controls" aria-label="West door toggles"></div></fieldset>
      <fieldset><legend>East segments</legend><div id="fd-east" class="fd-controls" aria-label="East door toggles"></div></fieldset>
      <label class="form-label" for="fd-visitor">Visitor chair</label>
      <select id="fd-visitor" class="form-select"><option value="D4">D4, facing North</option><option value="D2">D2, facing North</option></select>
      <div id="fd-status" class="fd-status" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('front-desk-layout-proof'), cols=['1','2','3','4','5'], rows=['A','B','C','D'];
    const segments=['N1','N2','N3','N4','N5','WA','WB','WC','WD','EA','EB','EC','ED'];
    const optional=[{id:'gallery',label:'north gallery + shadow',segments:['N1','N2'],row:'1',col:'2 / span 2'},{id:'ficus',label:'corner ficus + shadow',segments:['N1','WA'],row:'1',col:'1'},{id:'lamp',label:'east lamp + shadow',segments:['EC'],row:'3',col:'5'},{id:'bench',label:'west bench + shadow',segments:['WC','WD'],row:'3 / span 2',col:'1'}];
    const state={selected:new Set(),visitor:'D4',last:'N1'}, cell=(r,c)=>r+c;
    const permanent=visitor=>new Set(['C2','C3','B2',visitor]);
    const doorInside=id=>id[0]==='N'?'A'+id.slice(1):id[0]==='W'?id.slice(1)+'1':id.slice(1)+'5';
    const neighbors=target=>{const r=rows.indexOf(target[0]),c=cols.indexOf(target.slice(1));return [[r-1,c],[r,c+1],[r+1,c],[r,c-1]].filter(([a,b])=>a>=0&&a<4&&b>=0&&b<5).map(([a,b])=>cell(rows[a],cols[b]))};
    const bfs=(target,visitor=state.visitor)=>{const blocked=permanent(visitor),start='D3';if(blocked.has(target)||blocked.has(start))return [];const queue=[start],prev=new Map([[start,null]]);while(queue.length){const current=queue.shift();if(current===target){const route=[];for(let p=current;p;p=prev.get(p))route.unshift(p);return route}for(const next of neighbors(current))if(!blocked.has(next)&&!prev.has(next)){prev.set(next,current);queue.push(next)}}return []};
    const seatApproach=(seat,visitor)=>neighbors(seat).filter(tile=>!permanent(visitor).has(tile)&&bfs(tile,visitor).length);
    const evaluate=(mask,visitor)=>{const active=segments.filter((_,i)=>mask&(1<<i)),visitorFront='C'+visitor.slice(1);const routes=segments.map(id=>({id,path:bfs(doorInside(id),visitor)}));return {active,routes,hidden:optional.filter(item=>item.segments.some(id=>active.includes(id))).map(item=>item.id),reachable:routes.filter(item=>item.path.length).length,seatApproaches:{receptionist:seatApproach('B2',visitor),visitor:seatApproach(visitor,visitor)},visitorFront,visitorFrontClear:!permanent(visitor).has(visitorFront),service:bfs('D3',visitor)}};
    const map=root.querySelector('#fd-map'),status=root.querySelector('#fd-status'),visitor=root.querySelector('#fd-visitor');
    rows.forEach((r,ri)=>cols.forEach((c,ci)=>{const el=document.createElement('div');el.className='fd-tile';el.dataset.cell=cell(r,c);el.style.gridArea=`${ri+1}/${ci+1}`;el.textContent=cell(r,c);map.append(el)}));const entryLabel=document.createElement('span');entryLabel.className='fd-entry-label';entryLabel.style.gridArea='4/3';entryLabel.textContent='D3 entry';map.append(entryLabel);
    [['N',['N1','N2','N3','N4','N5'],'fd-north'],['W',['WA','WB','WC','WD'],'fd-west'],['E',['EA','EB','EC','ED'],'fd-east']].forEach(([,ids,target])=>ids.forEach(id=>{const button=document.createElement('button');button.type='button';button.className='btn';button.dataset.segment=id;button.textContent=id;button.setAttribute('aria-label',`Toggle door at ${id}`);button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>{state.selected.has(id)?state.selected.delete(id):state.selected.add(id);state.last=id;render()});root.querySelector('#'+target).append(button)}));
    visitor.addEventListener('change',()=>{state.visitor=visitor.value;render()});
    function solid(id,label,row,col,extra=''){const el=document.createElement('div');el.className=`fd-solid ${extra}`;el.dataset.solid=id;el.style.gridRow=row;el.style.gridColumn=col;el.textContent=label;return el}
    function render(){const mask=segments.reduce((total,id,index)=>total|(state.selected.has(id)?1<<index:0),0),model=evaluate(mask,state.visitor),route=bfs(doorInside(state.last));map.querySelectorAll('.fd-solid,.fd-optional').forEach(el=>el.remove());map.querySelectorAll('.fd-tile').forEach(el=>el.classList.remove('route','door-north','door-west','door-east','entry'));
      route.forEach(tile=>map.querySelector(`[data-cell="${tile}"]`).classList.add('route'));map.querySelector('[data-cell="D3"]').classList.add('entry');state.selected.forEach(id=>{const tile=map.querySelector(`[data-cell="${doorInside(id)}"]`);tile.classList.add(id[0]==='N'?'door-north':id[0]==='W'?'door-west':'door-east')});
      map.append(solid('desk','desk',3,'2 / span 2','desk'),solid('reception','R ↓',2,'2'),solid('visitor','V ↑',4,state.visitor.slice(1)));optional.forEach(item=>{const el=document.createElement('div');el.className=`fd-optional ${model.hidden.includes(item.id)?'fd-hidden':''}`;el.dataset.optional=item.id;el.style.gridRow=item.row;el.style.gridColumn=item.col;el.textContent=item.id;map.append(el)});
      root.querySelectorAll('[data-segment]').forEach(button=>{const open=state.selected.has(button.dataset.segment);button.setAttribute('aria-pressed',String(open));button.classList.toggle('btn-primary',open)});const hidden=optional.filter(item=>model.hidden.includes(item.id)).map(item=>item.label),doorState=state.selected.has(state.last)?'open':'candidate closed',visitorClear=model.visitorFrontClear?`${model.visitorFront} clear`:`${model.visitorFront} solid desk`;status.innerHTML=`<strong>${state.last} · ${doorState}</strong>: approach D3 → ${doorInside(state.last)} · ${route.length?route.length-1:'blocked'} steps<br>${model.reachable}/13 door approaches reachable · visitor front: ${visitorClear} · hidden: ${hidden.length?hidden.join('; '):'none'} · service: D3`;
    }
    window.__frontDeskLayout={segments,optional,evaluate,bfs,doorInside,permanent,render};render();
  })();
  </script>
</section>
