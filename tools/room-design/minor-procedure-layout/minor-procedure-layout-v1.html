  const addButton=(id,target,label,hit=false)=>{const button=document.createElement('button');button.type='button';button.className=hit?'minor-hit':'btn';button.dataset.segment=id;button.textContent=hit?'':id;button.setAttribute('aria-label',label);button.addEventListener('click',()=>{state.doors.has(id)?state.doors.delete(id):state.doors.add(id);state.selected=id;render()});target.append(button)};
  for(const[prefix,targetId]of[['N','minor-north'],['S','minor-south'],['W','minor-west'],['E','minor-east']])for(const id of segments.filter(segment=>segment[0]===prefix))addButton(id,root.querySelector('#'+targetId),`Toggle door at ${id}`);for(const id of segments)addButton(id,targets,`Wall door ${id}`,true);for(const id of ['N1','N2','N3']){const label=document.createElement('label');label.className='form-check';label.innerHTML=`<input class="form-check-input" type="checkbox" data-adjacent="${id}"><span class="form-check-label">${id}</span>`;label.querySelector('input').addEventListener('change',event=>{event.target.checked?state.adjacent.add(id):state.adjacent.delete(id);render()});root.querySelector('#minor-adjacency').append(label)}optionalToggle.addEventListener('change',()=>{state.optional=optionalToggle.checked;render()});overlay.addEventListener('change',render);
  window.__minorProcedureLayout={segments,state,fixtures,crops,radius,step,start,validPoint,candidates,bfs,routeToDoor,routes,serviceRoutes,hiddenOptional,render,ready:()=>atlas.complete&&atlas.naturalWidth>0};render();
})();
