<section id="hallway-proof" aria-labelledby="hallway-title">
<h2 id="hallway-title">Hallway foundation preview</h2>
<div class="viz-controls"><label class="form-label" for="hall-preset">Hall shape <select id="hall-preset" class="form-select" aria-label="Hall shape"><option value="straight">Straight</option><option value="corner">Corner</option><option value="tee">T junction</option><option value="cross" selected>Cross junction</option></select></label></div>
<div id="hall-art-wrap"><canvas id="hall-art" width="760" height="610" role="img" aria-label="Interactive hallway shell with room connections"></canvas><div id="hall-hit-targets"></div></div>
<div id="hall-north-controls" class="viz-controls" aria-label="Rooms immediately north"></div><div id="hall-door-controls" aria-label="Boundary connection controls"></div><p id="hall-status" class="text-small text-muted" aria-live="polite"></p>
</section>
<style>
#hallway-proof{max-width:760px}#hallway-proof #hall-art-wrap{position:relative;width:100%;max-width:760px}#hallway-proof #hall-art{display:block;width:100%;height:auto}#hallway-proof #hall-hit-targets{position:absolute;inset:0}#hallway-proof .hall-hit{position:absolute;min-width:0;min-height:0;padding:0;border:0;background:transparent;color:transparent;cursor:pointer}#hallway-proof .hall-hit:focus-visible{outline:3px solid var(--ring);outline-offset:-3px}#hallway-proof .hall-control-group{margin-block:.5rem}#hallway-proof .hall-control-group>span{display:block;margin-bottom:.25rem}#hallway-proof .hall-button-row{display:flex;flex-wrap:wrap;gap:.35rem}
</style>
<script>
(()=>{
const root=document.getElementById('hallway-proof'),canvas=document.getElementById('hall-art'),ctx=canvas.getContext('2d'),preset=document.getElementById('hall-preset'),hits=document.getElementById('hall-hit-targets'),doors=document.getElementById('hall-door-controls'),north=document.getElementById('hall-north-controls'),status=document.getElementById('hall-status');
const W=760,H=610,S=120,sideCap=14,northTall=90,northLow=29,southLow=29,inset=12,C={bg:'#f2ead7',cream:'#efe1bd',northFace:'#ddd5c8',sage:'#58735a',light:'#789173',dark:'#294632',wood:'#744a29'},P={hall:['#d8d1bf','#ddd7c7','#d2cbbb'],neighbor:['#c8d0c6','#d0d7cd','#bec8bd']};
const presets={straight:[[0,0],[1,0],[2,0],[3,0]],corner:[[0,0],[0,1],[1,1],[2,1]],tee:[[0,1],[1,1],[2,1],[1,0]],cross:[[1,0],[0,1],[1,1],[2,1],[1,2]]},defaults={straight:['W-A1','E-A4'],corner:['N-A1','E-B3'],tee:['W-B1','N-A2','E-B3'],cross:['N-A2','W-B1','E-B3','S-C2']},dirs=[['N',0,-1],['E',1,0],['S',0,1],['W',-1,0]],state={open:new Set(defaults.cross),adjacent:new Set(),last:'N-A2'},key=(x,y)=>x+':'+y,letter=n=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[n];
function model(name=preset.value){const cells=presets[name],xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]),box={minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)},have=new Set(cells.map(c=>key(...c))),edges=[];for(const[x,y]of cells)for(const[d,dx,dy]of dirs)if(!have.has(key(x+dx,y+dy))){const col=x-box.minX,row=y-box.minY;edges.push({id:`${d}-${letter(row)}${col+1}`,d,x,y,col,row})}const cols=box.maxX-box.minX+1,rows=box.maxY-box.minY+1;return{name,cells,have,edges,box,cols,rows,ox:(W-cols*S)/2,oy:150+(360-rows*S)/2}}
const pt=(m,x,y)=>({x:m.ox+(x-m.box.minX)*S,y:m.oy+(y-m.box.minY)*S});
function geometry(m,e){const p=pt(m,e.x,e.y),low=e.d==='N'&&state.adjacent.has(e.id);if(e.d==='N')return{x:p.x,y:p.y-(low?northLow:northTall),w:S,h:low?northLow:northTall,base:p.y,low};if(e.d==='S')return{x:p.x,y:p.y+S,w:S,h:southLow,base:p.y+S};const northEdge=m.edges.find(q=>q.d==='N'&&q.x===e.x&&q.y===e.y),isLow=northEdge&&state.adjacent.has(northEdge.id),top=northEdge?p.y-(isLow?northLow:northTall)-(isLow?0:9):p.y;return{x:e.d==='W'?p.x-sideCap:p.x+S,y:top,w:sideCap,h:p.y+S+southLow-top,base:p.y}}
function texture(x,y,w,h,pal,px=0,py=0){if(w<=0||h<=0)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle=pal[0];ctx.fillRect(x,y,w,h);const tw=30,th=24,sx=Math.floor((x-px)/tw)*tw+px,sy=Math.floor((y-py)/th)*th+py;for(let yy=sy;yy<y+h;yy+=th)for(let xx=sx;xx<x+w;xx+=tw){const n=Math.abs(Math.round(xx*13+yy*7));ctx.globalAlpha=.24;ctx.fillStyle=pal[1+n%2];ctx.fillRect(xx+1,yy+1,tw-2,th-2);ctx.globalAlpha=.13;ctx.fillStyle=n%2?'#fff':'#756f63';ctx.fillRect(xx+6+n%17,yy+5+n%11,1+n%2,1);ctx.fillRect(xx+4+(n*3)%21,yy+4+(n*5)%15,1,1+n%2)}ctx.globalAlpha=1;ctx.strokeStyle='rgba(82,78,68,.13)';ctx.lineWidth=1;for(let xx=sx;xx<=x+w;xx+=tw){ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}for(let yy=sy;yy<=y+h;yy+=th){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}ctx.restore()}
function floor(m){const path=new Path2D();for(const[x,y]of m.cells){const p=pt(m,x,y);path.rect(p.x,p.y,S,S)}ctx.save();ctx.clip(path);texture(m.ox,m.oy,m.cols*S,m.rows*S,P.hall,m.ox-m.box.minX*S,m.oy-m.box.minY*S);ctx.restore()}
function aperture(m,e){const p=pt(m,e.x,e.y);if(e.d==='N'||e.d==='S')return{x:p.x+inset,y:e.d==='N'?p.y-northTall:p.y+S-6,w:S-2*inset,h:e.d==='N'?northTall:southLow+6};return{x:e.d==='W'?p.x-sideCap:p.x+S,y:p.y+inset,w:sideCap,h:S-2*inset}}
function neighbor(m,e,full=false){const p=pt(m,e.x,e.y),a=aperture(m,e),d=42;if(e.d==='N')texture(full?p.x:a.x,p.y-(full?64:northTall),full?S:a.w,full?64:northTall,P.neighbor,m.ox,m.oy);else if(e.d==='S')texture(a.x,p.y+S+southLow,a.w,d,P.neighbor,m.ox,m.oy);else if(e.d==='W')texture(p.x-sideCap-d,a.y,sideCap+d,a.h,P.neighbor,m.ox,m.oy);else texture(p.x+S,a.y,sideCap+d,a.h,P.neighbor,m.ox,m.oy)}
function northWall(m,e){const g=geometry(m,e),capY=g.low?g.y:g.y-9;ctx.fillStyle=C.northFace;ctx.fillRect(g.x,g.y,g.w,g.h);ctx.fillStyle=C.sage;ctx.fillRect(g.x,g.base-24,g.w,24);ctx.fillStyle=C.dark;ctx.fillRect(g.x-1,capY,g.w+2,9);ctx.fillStyle=C.light;ctx.fillRect(g.x-1,capY,g.w+2,3)}
function sideWall(m,e){const g=geometry(m,e);ctx.fillStyle=C.dark;ctx.fillRect(g.x,g.y,g.w,g.h);ctx.fillStyle=C.light;ctx.fillRect(g.x+(e.d==='E'?0:11),g.y,3,g.h)}
function southWall(m,e){const g=geometry(m,e);ctx.fillStyle=C.cream;ctx.fillRect(g.x,g.y,g.w,g.h);ctx.fillStyle=C.sage;ctx.fillRect(g.x,g.y+21,g.w,8);ctx.fillStyle=C.dark;ctx.fillRect(g.x,g.y-6,g.w,8);ctx.fillStyle=C.light;ctx.fillRect(g.x,g.y-6,g.w,3)}
function transitions(m){const a=m.edges.filter(e=>e.d==='N').sort((x,y)=>x.y-y.y||x.x-y.x);for(let i=0;i<a.length-1;i++){const u=a[i],v=a[i+1];if(u.y!==v.y||v.x!==u.x+1)continue;const gu=geometry(m,u),gv=geometry(m,v);if(gu.y===gv.y)continue;const x=gu.x+S-4,y=Math.min(gu.y,gv.y)-9,b=Math.max(gu.y,gv.y);ctx.fillStyle=C.dark;ctx.fillRect(x,y,8,b-y);ctx.fillStyle=C.light;ctx.fillRect(x,y,3,b-y)}}
function openNorth(m,e){const p=pt(m,e.x,e.y),low=state.adjacent.has(e.id),top=p.y-(low?northLow:northTall),l=p.x+inset,r=p.x+S-inset;ctx.clearRect(l,top,r-l,p.y-top);texture(l,top,r-l,p.y-top,P.neighbor,m.ox,m.oy);ctx.fillStyle=C.wood;ctx.fillRect(l-5,top,5,p.y-top);ctx.fillRect(r,top,5,p.y-top);if(!low)ctx.fillRect(l-5,top-5,r-l+10,6)}
function openSide(m,e){const p=pt(m,e.x,e.y),left=e.d==='W',x=left?p.x-sideCap:p.x+S,y=p.y+inset,h=S-2*inset,half=7;ctx.clearRect(x,y,sideCap,h);if(left){texture(x,y,half,h,P.neighbor,m.ox,m.oy);texture(x+half,y,half,h,P.hall,m.ox,m.oy)}else{texture(x,y,half,h,P.hall,m.ox,m.oy);texture(x+half,y,half,h,P.neighbor,m.ox,m.oy)}ctx.fillStyle=C.wood;ctx.fillRect(x-2,y-3,18,5);ctx.fillRect(x-2,y+h-2,18,5)}
function openSouth(m,e){const p=pt(m,e.x,e.y),l=p.x+inset,r=p.x+S-inset,b=p.y+S;ctx.clearRect(l,b-6,r-l,southLow+6);texture(l,b-6,r-l,southLow+6,P.hall,m.ox,m.oy);texture(l,b+southLow,r-l,36,P.neighbor,m.ox,m.oy);ctx.fillStyle=C.wood;ctx.fillRect(l-5,b-6,5,southLow+6);ctx.fillRect(r,b-6,5,southLow+6)}
function toggle(id){state.open.has(id)?state.open.delete(id):state.open.add(id);state.last=id;draw();root.querySelector(`#hall-door-controls [data-edge="${id}"]`)?.focus()}
function sync(m){hits.replaceChildren();doors.replaceChildren();north.replaceChildren();const ns=m.edges.filter(e=>e.d==='N');if(ns.length){const t=document.createElement('span');t.className='text-small';t.textContent='Room immediately north of';north.append(t);for(const e of ns){const l=document.createElement('label');l.className='form-check';const i=document.createElement('input');i.type='checkbox';i.className='form-check-input';i.dataset.adjacent=e.id;i.checked=state.adjacent.has(e.id);i.onchange=()=>{i.checked?state.adjacent.add(e.id):state.adjacent.delete(e.id);draw()};const q=document.createElement('span');q.className='form-check-label';q.textContent=e.id;l.append(i,q);north.append(l)}}for(const d of 'NESW'){const es=m.edges.filter(e=>e.d===d);if(!es.length)continue;const g=document.createElement('div');g.className='hall-control-group';const h=document.createElement('span');h.className='text-small text-muted';h.textContent={N:'North',E:'East',S:'South',W:'West'}[d];const row=document.createElement('div');row.className='hall-button-row';g.append(h,row);for(const e of es){const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.edge=e.id;b.textContent=e.id;b.setAttribute('aria-pressed',state.open.has(e.id));b.onclick=()=>toggle(e.id);row.append(b);const q=geometry(m,e),hit=document.createElement('button');hit.type='button';hit.className='hall-hit';hit.dataset.edge=e.id;hit.setAttribute('aria-label',`Toggle room connection ${e.id}`);hit.setAttribute('aria-pressed',state.open.has(e.id));Object.assign(hit.style,{left:q.x/W*100+'%',top:q.y/H*100+'%',width:q.w/W*100+'%',height:q.h/H*100+'%'});hit.onclick=()=>toggle(e.id);hits.append(hit)}doors.append(g)}}
function draw(){const m=model();state.open=new Set([...state.open].filter(id=>m.edges.some(e=>e.id===id)));state.adjacent=new Set([...state.adjacent].filter(id=>m.edges.some(e=>e.id===id&&e.d==='N')));ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);for(const e of m.edges)if(state.open.has(e.id)||(e.d==='N'&&state.adjacent.has(e.id)))neighbor(m,e,e.d==='N'&&state.adjacent.has(e.id));for(const e of m.edges)if(e.d==='N')northWall(m,e);for(const e of m.edges)if('EW'.includes(e.d))sideWall(m,e);transitions(m);floor(m);for(const e of m.edges)if(e.d==='S')southWall(m,e);for(const e of m.edges)if(state.open.has(e.id)){if(e.d==='N')openNorth(m,e);else if(e.d==='S')openSouth(m,e);else openSide(m,e)}sync(m);status.innerHTML=`<strong>${preset.options[preset.selectedIndex].text}</strong> · ${m.cells.length} walkable cells · ${m.edges.length} outer segments · ${state.open.size} open connections`;canvas.dataset.model=JSON.stringify({name:m.name,cells:m.cells,edges:m.edges.map(({id,d,x,y})=>({id,d,x,y})),open:[...state.open],adjacent:[...state.adjacent],origin:{x:m.ox,y:m.oy},cellSize:S,sideCap,northTall,northLow,southLow,inset})}
preset.onchange=()=>{state.open=new Set(defaults[preset.value]);state.adjacent.clear();state.last=[...state.open][0]||'';draw()};window.__hallwayLayout={presets,model,geometry,state,draw,constants:{W,H,S,sideCap,northTall,northLow,southLow,inset},ready:()=>Boolean(canvas.dataset.model)};draw();
})();
</script>
