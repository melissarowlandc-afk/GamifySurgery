<section id="waiting-layout-proof" aria-labelledby="waiting-title">
  <style>
    #waiting-layout-proof{max-width:900px;margin-inline:auto}#waiting-layout-proof .waiting-art-wrap{position:relative;max-width:736px;margin:12px auto 0}#waiting-layout-proof .waiting-art{display:block;width:100%;height:auto}#waiting-layout-proof .waiting-hit{position:absolute;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}#waiting-layout-proof .waiting-primary{max-width:736px;margin:10px auto 0}#waiting-layout-proof fieldset{border:0;margin:0 0 9px;padding:0}#waiting-layout-proof legend{font-weight:var(--font-weight-medium);margin-bottom:4px}#waiting-layout-proof .waiting-controls{display:flex;gap:5px;flex-wrap:wrap}#waiting-layout-proof .waiting-control-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}#waiting-layout-proof .waiting-control-label{color:var(--muted-foreground);margin-right:3px}#waiting-layout-proof .waiting-route-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(170px,2fr) auto;gap:8px;align-items:end}#waiting-layout-proof .waiting-status{margin-top:8px;border-left:3px solid var(--primary);padding-left:10px;min-height:2.5em}#waiting-layout-proof .waiting-note{margin-top:6px;color:var(--muted-foreground)}@media(max-width:520px){#waiting-layout-proof .waiting-route-row{grid-template-columns:1fr}#waiting-layout-proof .waiting-route-row .btn{justify-self:start}}
  </style>
  <h2 id="waiting-title">Waiting Room preview</h2>
  <div class="waiting-art-wrap">
    <canvas id="waiting-art" class="waiting-art" width="1440" height="1116" role="img" aria-label="Four by three Waiting Room with physical furniture footprints, selectable doorways and a walking preview."></canvas>
    <div id="waiting-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="waiting-primary">
    <label class="form-label" for="waiting-orientation">Room orientation <select id="waiting-orientation" class="form-select"><option value="0">Original · 4 × 3</option><option value="90">90° · west-side view · 3 × 4</option></select></label>
    <fieldset><legend>Room immediately north of</legend><div id="waiting-adjacency" class="waiting-controls"></div></fieldset>
    <fieldset><legend>Open doorway</legend><div class="waiting-control-row"><div><span class="waiting-control-label text-small">North</span><span id="waiting-north" class="waiting-controls"></span></div><div><span class="waiting-control-label text-small">South</span><span id="waiting-south" class="waiting-controls"></span></div><div><span class="waiting-control-label text-small">West</span><span id="waiting-west" class="waiting-controls"></span></div><div><span class="waiting-control-label text-small">East</span><span id="waiting-east" class="waiting-controls"></span></div></div></fieldset>
    <div class="waiting-route-row"><label class="form-label" for="waiting-route">Walking preview <select id="waiting-route" class="form-select"><option value="behind">Behind bench</option><option value="chairs">Around side chairs</option><option value="south">South aisle</option></select></label><label class="form-label" for="waiting-progress">Progress <input id="waiting-progress" class="form-range" type="range" min="0" max="100" value="35"></label><button id="waiting-play" class="btn" type="button">Play once</button></div>
    <label class="form-check"><input id="waiting-optional" class="form-check-input" type="checkbox" checked><span class="form-check-label">Show optional table and decor</span></label>
    <label class="form-check"><input id="waiting-footprints" class="form-check-input" type="checkbox"><span class="form-check-label">Show footprints and provisional clearance</span></label>
    <div class="waiting-note text-small"><strong>Seat directions:</strong> bench South, left chair East, right chair West. Rotated view: bench East, left chair North, right chair South.</div>
    <div id="waiting-status" class="waiting-status text-small" role="status" aria-live="polite"></div>
  </div>
  <script>__WAITING_SCRIPT__</script>
</section>
