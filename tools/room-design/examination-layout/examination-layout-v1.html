<section id="examination-layout-proof" aria-labelledby="exam-title">
  <style>
    #examination-layout-proof{max-width:900px;margin-inline:auto}#examination-layout-proof .exam-art-wrap{position:relative;max-width:720px;margin:14px auto 0}#examination-layout-proof .exam-art{display:block;width:100%}#examination-layout-proof .exam-hit{position:absolute;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}#examination-layout-proof .exam-primary{max-width:720px;margin:10px auto 0}#examination-layout-proof fieldset{border:0;margin:0 0 9px;padding:0}#examination-layout-proof legend{font-weight:var(--font-weight-medium);margin-bottom:4px}#examination-layout-proof .exam-controls{display:flex;gap:5px;flex-wrap:wrap}#examination-layout-proof .exam-control-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}#examination-layout-proof .exam-control-label{color:var(--muted-foreground);margin-right:3px}#examination-layout-proof .exam-status{margin-top:10px;border-left:3px solid var(--primary);padding-left:10px;min-height:3em}#examination-layout-proof .exam-note{margin-top:6px;color:var(--muted-foreground)}
  </style>
  <h2 id="exam-title">Examination Room preview</h2>
  <p class="text-small text-muted">3 × 2 tiles · narrow-table clearance proposal · click any perimeter wall segment.</p>
  <div class="exam-art-wrap" aria-label="Candidate Examination Room presentation">
    <canvas id="exam-art" class="exam-art" width="600" height="450" role="img" aria-label="Three by two Examination Room with ten selectable perimeter door openings and a narrow solid examination table."></canvas>
    <div id="exam-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="exam-primary">
    <fieldset><legend>Room immediately north of</legend><div id="exam-adjacency" class="exam-controls"><label class="form-check"><input class="form-check-input" type="checkbox" data-adjacent="N1"><span class="form-check-label">N1</span></label><label class="form-check"><input class="form-check-input" type="checkbox" data-adjacent="N2"><span class="form-check-label">N2</span></label><label class="form-check"><input class="form-check-input" type="checkbox" data-adjacent="N3"><span class="form-check-label">N3</span></label></div></fieldset>
    <fieldset><legend>Open door frame</legend><div class="exam-control-row"><div><span class="exam-control-label text-small">North</span><span id="exam-north" class="exam-controls"></span></div><div><span class="exam-control-label text-small">South</span><span id="exam-south" class="exam-controls"></span></div><div><span class="exam-control-label text-small">West</span><span id="exam-west" class="exam-controls"></span></div><div><span class="exam-control-label text-small">East</span><span id="exam-east" class="exam-controls"></span></div></div></fieldset>
    <label class="form-check"><input id="exam-clearance" class="form-check-input" type="checkbox"><span class="form-check-label">Show walking space and footprints</span></label>
    <div id="exam-status" class="exam-status text-small" role="status" aria-live="polite"></div>
    <p class="exam-note text-small">Character fit still needs an occupied preview.</p>
  </div>
