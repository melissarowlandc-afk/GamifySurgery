<section id="ct-layout-proof"><h2>CT Suite room preview</h2><p>4 × 4 tiles · Click a wall to open or close a doorway.</p><label class="form-check"><input id="ct-overlay" class="form-check-input" type="checkbox"><span class="form-check-label">Show floor footprints and routes</span></label><div class="ct-art-wrap"><canvas id="ct-art" width="588" height="680" aria-label="CT Suite art preview"></canvas><div id="ct-targets" aria-label="Canvas wall doorway controls"></div></div><div class="ct-controls"><div><strong>North</strong><span id="ct-N"></span></div><div><strong>West</strong><span id="ct-W"></span></div><div><strong>East</strong><span id="ct-E"></span></div><div><strong>South</strong><span id="ct-S"></span></div></div><div id="ct-adjacent" class="ct-adjacent" aria-label="North neighbors"></div><output id="ct-status"></output></section><style>#ct-layout-proof{max-width:620px;margin:auto;background:transparent}#ct-layout-proof .ct-art-wrap{position:relative}#ct-layout-proof #ct-art{width:100%;height:auto;display:block}#ct-layout-proof .ct-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}#ct-layout-proof .ct-controls>div{display:flex;gap:4px;align-items:center;flex-wrap:wrap}#ct-layout-proof .ct-controls .btn{min-width:34px}#ct-layout-proof .ct-adjacent{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}#ct-layout-proof .ct-hit{position:absolute;opacity:0;background:transparent;border:0;cursor:pointer}#ct-layout-proof .ct-hit:focus-visible{opacity:1;outline:2px solid #b36a2e;outline-offset:-2px;background:rgba(179,106,46,.18)}#ct-layout-proof #ct-status{display:block;margin-top:8px;font-size:.9em}@media(max-width:360px){#ct-layout-proof{padding:0 4px}#ct-layout-proof .ct-controls{grid-template-columns:1fr}#ct-layout-proof .ct-adjacent{gap:5px}}</style><script>__CT_SCRIPT__</script>
