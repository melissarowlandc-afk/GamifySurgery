lice(1)-1);else if(id[0]==='S'){const i=+id.slice(1)-1,l=X+i*S+12,r=X+(i+1)*S-12;ctx.clearRect(l,BOTTOM-6,r-l,35);floor(l,BOTTOM-6,r-l,35);ctx.fillStyle=wood;ctx.fillRect(l-5,BOTTOM-8,5,37);ctx.fillRect(r,BOTTOM-8,5,37)}else sideDoor(id[0]==='E',id.charCodeAt(1)-65)}}
 function sprite(id,anchor,width,contact){const c=crops[id],scale=width/c.w,h=c.h*scale,x=X+anchor.x*S-contact.x*scale,y=Y+anchor.y*S-contact.y*scale;ctx.drawImage(atlas,c.x,c.y,c.w,c.h,x,y,width,h);return{x,y,w:width,h,baseX:x+contact.x*scale,baseY:y+contact.y*scale,aspect:c.w/c.h}}
 function hiddenWallDecor(){return Object.values(wallDecor).filter(d=>state.doors.has(d.segment)||state.adjacent.has(d.segment)).map(d=>d.id)}
 function drawWallDecor(){const hidden=hiddenWallDecor(),draws={};for(const d of Object.values(wallDecor)){if(hidden.includes(d.id))continue;const c=wallCrops[d.id],x=d.centerX-d.width/2;ctx.drawImage(wallAtlas,c.x,c.y,c.w,c.h,x,d.top,d.width,d.height);draws[d.id]={x,y:d.top,w:d.width,h:d.height,segment:d.segment,mount:'north wall',collision:'nonblocking'}}return{hidden,draws}}
 function drawPartition(){const r=fixtures.partition.footprint,x=X+r.left*S,y=Y+r.top*S,w=r.width*S,h=r.height*S;ctx.fillStyle='#38524a';ctx.fillRect(x,y,w,h);ctx.fillStyle='#7c9680';ctx.fillRect(x,y,w,4);ctx.fillStyle='#294632';ctx.fillRect(x,y,w,3);const wy=y+h*.39,wh=h*.25;ctx.fillStyle='#8ca8ae';ctx.fillRect(x-2,wy,w+4,wh);ctx.fillStyle='#45616a';ctx.fillRect(x-1,wy+3,w+2,wh-6);return{x,y,w,h,window:{x:x-2,y:wy,w:w+4,h:wh}}}
 function drawFurniture(){const decor=drawWallDecor(),scanner=sprite('scanner',fixtures.scanner.anchor,2*S,fixtures.scanner.floorContact),partition=drawPartition(),console=sprite('console',fixtures.console.anchor,1*S,fixtures.console.floorContact);return{scanner,partition,console,decor}}
 function drawOverlay(rs){if(!overlay.checked)return;ctx.save();const r=rs[state.selected]||[];ctx.strokeStyle='#2f7090';ctx.lineWidth=3;ctx.beginPath();r.forEach((p,i)=>i?ctx.lineTo(X+p.x*S,Y+p.y*S):ctx.moveTo(X+p.x*S,Y+p.y*S));ctx.stroke();for(const q of fixtures.scanner.physicalFootprints){ctx.setLineDash([3,3]);ctx.strokeStyle='#8d5a47';ctx.strokeRect(X+q.left*S,Y+q.top*S,q.width*S,q.height*S)}for(const f of [{footprint:fixtures.scanner.navigationBlocker},{footprint:fixtures.partition.footprint}]){const q=f.footprint;ctx.setLineDash([6,4]);ctx.strokeStyle='#6d466e';ctx.strokeRect(X+q.left*S,Y+q.top*S,q.width*S,q.height*S)}ctx.setLineDash([]);for(const[p,label,color]of[[fixtures.scanner.seat,'patient S','#8d5a47'],[fixtures.scanner.approach,'approach','#8d5a47'],[fixtures.console.approach,'tech N','#355f52']]){ctx.fillStyle=color;ctx.beginPath();ctx.arc(X+p.x*S,Y+p.y*S,5,0,7);ctx.fill();ctx.fillText(label,X+p.x*S+7,Y+p.y*S+3)}ctx.restore()}
 function slot(id){if(id[0]==='N'||id[0]==='S'){const i=+id.slice(1)-1;return{x:X+i*S,y:id[0]==='N'?(state.adjacent.has(id)?Y-29:Y-99):BOTTOM,w:S,h:id[0]==='N'?(state.adjacent.has(id)?29:99):29}}const i=id.charCodeAt(1)-65;return{x:id[0]==='W'?X-14:EAST,y:Y+i*S,w:14,h:S}}
 function render(){ctx.setTransform(1,0,0,1,0,0);drawShell();const draws=drawFurniture(),rs=routes();drawOverlay(rs);for(const b of targets.querySelectorAll('button')){const q=slot(b.dataset.segment);Object.assign(b.style,{left:`${q.x/W*100}%`,top:`${q.y/H*100}%`,width:`${q.w/W*100}%`,height:`${q.h/H*100}%`})}for(const btn of root.querySelectorAll('[data-segment]')){const on=state.doors.has(btn.dataset.segment);btn.setAttribute('aria-pressed',String(on));btn.classList.toggle('btn-primary',on)}const service=serviceRoutes();status.textContent=`${state.selected} ${state.doors.has(state.selected)?'open':'closed'} · ${Object.values(rs).filter(p=>p.length).length}/16 doorway approaches · patient ${service.patient.length?'reachable':'blocked'} · technician ${service.technician.length?'reachable':'blocked'}`;art.dataset.model=JSON.stringify({logicalCols:4,logicalRows:4,tileSize:S,doors:segments,adjacent:[...state.adjacent],selected:state.selected,open:[...state.doors],radius,fixtures,wallDecor,hiddenWallDecor:draws.decor.hidden,draws,routes:rs,service,shell:{northFace:'#dacbd5',backedNorth:'green only',rearWallHeight:90,lowNorthHeight:29,sideCapWidth:14,southHeight:29}})}
 for(const prefix of ['N','S','W','E'])for(const id of segments.filter(v=>v[0]===prefix)){const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.segment=id;b.textContent=id;b.setAttribute('aria-label',`Toggle ${id} doorway`);b.onclick=()=>{state.doors.has(id)?state.doors.delete(id):state.doors.add(id);state.selected=id;render()};root.querySelector(`#ct-${prefix}`).append(b)}
 for(const id of segments){const b=document.createElement('button');b.type='button';b.className='ct-hit';b.dataset.segment=id;b.setAttribute('aria-label',`Toggle ${id} doorway`);b.onclick=()=>{state.doors.has(id)?state.doors.delete(id):state.doors.add(id);state.selected=id;render()};targets.append(b)}
 for(let i=1;i<=4;i++){const label=document.createElement('label');label.className='form-check';label.innerHTML=`<input class="form-check-input" type="checkbox" data-adjacent="N${i}"><span class="form-check-label">N${i} backed</span>`;label.querySelector('input').onchange=e=>{e.target.checked?state.adjacent.add(`N${i}`):state.adjacent.delete(`N${i}`);render()};root.querySelector('#ct-adjacent').append(label)}
 overlay.onchange=render; window.__ctLayout={segments,state,fixtures,wallDecor,crops,radius,step,start,validPoint,bfs,doorCandidates,routes,render,hiddenWallDecor,ready:()=>atlas.complete&&atlas.naturalWidth>0&&wallAtlas.complete&&wallAtlas.naturalWidth>0};render();
})();
</script>
