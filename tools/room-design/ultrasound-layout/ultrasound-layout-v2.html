  function drawOverlay(routeMap,draws){if(!overlay.checked)return;ctx.save();ctx.font='10px sans-serif';ctx.fillStyle='rgba(41,70,50,.55)';for(let row=0;row<3;row++)for(let col=0;col<3;col++)ctx.fillText(`${String.fromCharCode(65+row)}${col+1}`,X+col*S+7,Y+row*S+15);for(const f of Object.values(fixtures)){const r=f.footprint;if(!r)continue;ctx.fillStyle=f.collision==='solid'?'rgba(141,90,71,.08)':'rgba(47,112,144,.08)';ctx.strokeStyle=f.collision==='solid'?'#8d5a47':'#2f7090';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.fillRect(X+r.left*S,Y+r.top*S,r.width*S,r.height*S);ctx.strokeRect(X+r.left*S,Y+r.top*S,r.width*S,r.height*S)}ctx.setLineDash([]);ctx.fillStyle='rgba(141,90,71,.14)';ctx.strokeStyle='#8d5a47';ctx.lineWidth=2;ctx.fillRect(X+navigationBlocker.left*S,Y+navigationBlocker.top*S,navigationBlocker.width*S,navigationBlocker.height*S);ctx.strokeRect(X+navigationBlocker.left*S,Y+navigationBlocker.top*S,navigationBlocker.width*S,navigationBlocker.height*S);ctx.fillStyle='#8d5a47';ctx.font='bold 11px sans-serif';ctx.fillText('B2 blocked',X+navigationBlocker.left*S+7,Y+navigationBlocker.top*S+16);const path=routeMap[state.selected];if(path.length){ctx.strokeStyle='#2f7090';ctx.lineWidth=3;ctx.beginPath();path.forEach((p,i)=>(i?ctx.lineTo(X+p.x*S,Y+p.y*S):ctx.moveTo(X+p.x*S,Y+p.y*S)));ctx.stroke()}for(const [id,label,color]of [['table','patient','#8d5a47'],['stool','technician','#2f7090']]){const f=fixtures[id],floor=f.seat.floorProjection,elevated=draws[id].seatScreen;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X+floor.x*S,Y+floor.y*S,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 11px sans-serif';ctx.fillText(`${label} floor`,X+floor.x*S+8,Y+floor.y*S+4);ctx.beginPath();ctx.arc(elevated.x,elevated.y,5,0,Math.PI*2);ctx.fill();ctx.fillText(`${label} seat ${f.facing}`,elevated.x+7,elevated.y+3)}const use=fixtures.console.approach;ctx.fillStyle='#355f52';ctx.beginPath();ctx.arc(X+use.x*S,Y+use.y*S,5,0,Math.PI*2);ctx.fill();ctx.fillText('console use N',X+use.x*S-70,Y+use.y*S+4);ctx.restore()}
  const hitSlot=id=>{if(id[0]==='N'||id[0]==='S'){const i=Number(id[1])-1;return{x:X+i*S,y:id[0]==='N'?(state.adjacent.has(id)?Y-29:Y-99):BOTTOM,w:S,h:id[0]==='N'?(state.adjacent.has(id)?29:99):29}}const i=id.charCodeAt(1)-65;return{x:id[0]==='W'?X-14:EAST,y:Y+i*S,w:14,h:S}};
  function render(){ctx.setTransform(SCALE,0,0,SCALE,0,0);ctx.imageSmoothingEnabled=true;drawShell();const fixtureState=drawFurniture(),routeMap=routes(),service=serviceRoutes();drawOverlay(routeMap,fixtureState.draws);for(const button of targets.querySelectorAll('button')){const b=hitSlot(button.dataset.segment);Object.assign(button.style,{left:`${b.x/W*100}%`,top:`${b.y/H*100}%`,width:`${b.w/W*100}%`,height:`${b.h/H*100}%`})}const reachable=Object.values(routeMap).filter(path=>path.length).length;status.innerHTML=`<strong>${state.selected}</strong> · ${state.doors.has(state.selected)?'open doorway':'closed wall'} · ${reachable}/12 approaches reachable from S2<br>B2 is the only blocked tile · patient ${service.patient.length?'reachable':'blocked'} · technician ${service.technician.length?'reachable':'blocked'} · console use ${service.console.length?'reachable':'blocked'} · hidden: ${fixtureState.hidden.join(', ')||'none'}`;root.querySelectorAll('[data-segment]').forEach(button=>{const active=state.doors.has(button.dataset.segment);button.setAttribute('aria-pressed',String(active));button.classList.toggle('btn-primary',active)});canvas.dataset.doors=[...state.doors].join(',');canvas.dataset.adjacency=[...state.adjacent].join(',');canvas.dataset.hidden=fixtureState.hidden.join(',');canvas.dataset.routes=JSON.stringify(routeMap);canvas.dataset.serviceRoutes=JSON.stringify(service);canvas.dataset.fixtures=JSON.stringify(Object.values(fixtures).map(f=>({...f,draw:fixtureState.draws[f.id]||null})));canvas.dataset.navigationBlocker=JSON.stringify(navigationBlocker);canvas.dataset.shell=JSON.stringify({logicalCols:3,logicalRows:3,tileSize:S,rearWallHeight:90,lowNorthHeight:29,sideCapWidth:14,southHeight:29,northLowHeader:false,sideDoorSeam:'half-thickness',southFloorToBase:true})}
  const addButton=(id,target,label,hit=false)=>{const button=document.createElement('button');button.type='button';button.className=hit?'ultrasound-hit':'btn';button.dataset.segment=id;button.textContent=hit?'':id;button.setAttribute('aria-label',label);button.addEventListener('click',()=>{state.doors.has(id)?state.doors.delete(id):state.doors.add(id);state.selected=id;render()});target.append(button)};
  for(const[prefix,targetId]of[['N','ultrasound-north'],['S','ultrasound-south'],['W','ultrasound-west'],['E','ultrasound-east']])for(const id of segments.filter(segment=>segment[0]===prefix))addButton(id,root.querySelector('#'+targetId),`Toggle door at ${id}`);for(const id of segments)addButton(id,targets,`Wall door ${id}`,true);for(const id of ['N1','N2','N3']){const label=document.createElement('label');label.className='form-check';label.innerHTML=`<input class="form-check-input" type="checkbox" data-adjacent="${id}"><span class="form-check-label">${id}</span>`;label.querySelector('input').addEventListener('change',event=>{event.target.checked?state.adjacent.add(id):state.adjacent.delete(id);render()});root.querySelector('#ultrasound-adjacency').append(label)}optionalToggle.addEventListener('change',()=>{state.optional=optionalToggle.checked;render()});overlay.addEventListener('change',render);
  window.__ultrasoundLayout={segments,state,fixtures,crops,radius,step,start,navigationBlocker,validPoint,candidates,bfs,routeToDoor,routes,serviceRoutes,hiddenOptional,render,ready:()=>atlas.complete&&atlas.naturalWidth>0};render();
})();
