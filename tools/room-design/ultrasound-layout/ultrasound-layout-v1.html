  function drawOverlay(routeMap,draws){if(!overlay.checked)return;ctx.save();ctx.font='10px sans-serif';ctx.fillStyle='rgba(41,70,50,.55)';for(let row=0;row<3;row++)for(let col=0;col<3;col++)ctx.fillText(`${String.fromCharCode(65+row)}${col+1}`,X+col*S+7,Y+row*S+15);for(const f of Object.values(fixtures)){const r=f.footprint;if(!r)continue;ctx.fillStyle=f.collision==='solid'?'rgba(141,90,71,.08)':'rgba(47,112,144,.08)';ctx.strokeStyle=f.collision==='solid'?'#8d5a47':'#2f7090';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.fillRect(X+r.left*S,Y+r.top*S,r.width*S,r.height*S);ctx.strokeRect(X+r.left*S,Y+r.top*S,r.width*S,r.height*S)}ctx.setLineDash([]);ctx.fillStyle='rgba(141,90,71,.14)';ctx.strokeStyle='#8d5a47';ctx.lineWidth=2;ctx.fillRect(X+navigationBlocker.left*S,Y+navigationBlocker.top*S,navigationBlocker.width*S,navigationBlocker.height*S);ctx.strokeRect(X+navigationBlocker.left*S,Y+navigationBlocker.top*S,navigationBlocker.width*S,navigationBlocker.height*S);ctx.fillStyle='#8d5a47';ctx.font='bold 11px sans-serif';ctx.fillText('B2 blocked',X+navigationBlocker.left*S+7,Y+navigationBlocker.top*S+16);const path=routeMap[state.selected];if(path.length){ctx.strokeStyle='#2f7090';ctx.lineWidth=3;ctx.beginPath();path.forEach((p,i)=>(i?ctx.lineTo(X+p.x*S,Y+p.y*S):ctx.moveTo(X+p.x*S,Y+p.y*S)));ctx.stroke()}for(const [id,label,color]of [['table','patient','#8d5a47'],['stool','technician','#2f7090']]){const f=fixtures[id],floor=f.seat.floorProjection,elevated=draws[id].seatScreen;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(X+floor.x*S,Y+floor.y*S,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 11px sans-serif';ctx.fillText(`${label} floor`,X+floor.x*S+8,Y+floor.y*S+4);ctx.beginPath();ctx.arc(elevated.x,elevated.y,5,0,Math.PI*2);ctx.fill();ctx.fillText(`${label} seat ${f.facing}`,elevated.x+7,elevated.y+3)}const use=fixtures.console.approach;ctx.fillStyle='#355f52';ctx.beginPath();ctx.arc(X+use.x*S,Y+use.y*S,5,0,Math.PI*2);ctx.fill();ctx.fillT
