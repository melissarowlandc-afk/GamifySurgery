name: Deploy owner playtest to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # G-46-01 (release 50, 2026-11-21): the single serial `npm test` step reached
  # the 75-minute job limit. Every test still runs and still blocks the
  # publish: the suites are split across parallel jobs and `deploy` needs all
  # of them. The boundary scripts still run inside `build:pages`.
  deterministic-tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: domain 1/2
            command: npm test -w packages/game-domain -- --pool=forks --maxWorkers=2 --shard=1/2
          - name: domain 2/2
            command: npm test -w packages/game-domain -- --pool=forks --maxWorkers=2 --shard=2/2
          - name: player 1/2
            command: npm test -w apps/player -- --pool=forks --maxWorkers=2 --shard=1/2 '--exclude=**/questionProgramBatch3SaveCompatibility.test.ts' '--exclude=**/questionProgramBatch4SaveCompatibility.test.ts'
          - name: player 2/2
            command: npm test -w apps/player -- --pool=forks --maxWorkers=2 --shard=2/2 '--exclude=**/questionProgramBatch3SaveCompatibility.test.ts' '--exclude=**/questionProgramBatch4SaveCompatibility.test.ts'
          - name: player batch 3 save compatibility
            command: npm test -w apps/player -- --pool=forks --maxWorkers=1 src/questionProgramBatch3SaveCompatibility.test.ts
          - name: player batch 4 save compatibility
            command: npm test -w apps/player -- --pool=forks --maxWorkers=1 src/questionProgramBatch4SaveCompatibility.test.ts
          - name: other workspaces
            command: npm test -w apps/clinical-context-workbench -w packages/balance-config -w packages/clinical-authoring -w packages/clinical-content -w packages/clinical-research
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: ${{ matrix.command }}

  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    needs: deterministic-tests
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify Pages artifact
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_LOCAL_PROTOTYPE_BYPASS: 'false'
          VITE_CLOUD_SAVES_ENABLED: ${{ vars.VITE_CLOUD_SAVES_ENABLED || 'false' }}
          VITE_CLOUD_SAVES_REGION: ${{ vars.VITE_CLOUD_SAVES_REGION || '' }}
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload player artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/player/dist

      # The Pages artifact can take a few seconds to be listed after upload;
      # deploy-pages fails at once with "No artifacts named github-pages" if
      # it looks too early (releases 48, 2026-11-20). Wait until it is listed.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "${count:-0}" -ge 1 ]; then echo "github-pages artifact listed (count ${count})"; exit 0; fi
            sleep 10
          done
          echo "github-pages artifact still not listed after 5 minutes"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
