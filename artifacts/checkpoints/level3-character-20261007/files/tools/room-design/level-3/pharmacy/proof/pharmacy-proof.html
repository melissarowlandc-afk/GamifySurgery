<section id="pharmacy-proof" aria-labelledby="pharmacy-title">
  <style>
    #pharmacy-proof{max-width:920px;margin-inline:auto}#pharmacy-proof *{box-sizing:border-box}
    #pharmacy-proof .or-art-wrap{position:relative;max-width:480px;margin:12px auto 0}
    #pharmacy-proof .or-art{position:relative;z-index:1;display:block;width:100%;height:auto}
    #pharmacy-proof .or-hit{position:absolute;z-index:2;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}
    #pharmacy-proof .or-controls{max-width:480px;margin:10px auto 0}
    #pharmacy-proof fieldset{border:0;margin:0 0 9px;padding:0}#pharmacy-proof legend{font-weight:500;margin-bottom:4px}
    #pharmacy-proof .or-buttons{display:flex;gap:4px;flex-wrap:wrap}#pharmacy-proof .or-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-items:start}
    #pharmacy-proof .or-label{color:var(--muted-foreground,#6b7280);display:block;margin-bottom:3px}
    #pharmacy-proof .or-options{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0}
    #pharmacy-proof .or-status{margin-top:8px;border-left:3px solid var(--primary,#52756d);padding-left:10px;min-height:3em}
    #pharmacy-proof .or-note{margin-top:6px;color:var(--muted-foreground,#6b7280)}
    #pharmacy-proof .or-scale-wrap{max-width:720px;margin:10px auto 0}
    #pharmacy-proof .or-scale{display:block;width:100%;height:auto;background:#aebfc0}
    #pharmacy-proof .or-scale-labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin-top:4px}
    @media(max-width:560px){#pharmacy-proof .or-row{grid-template-columns:1fr}#pharmacy-proof .or-options{display:grid;grid-template-columns:1fr}}
  </style>
  <h2 id="pharmacy-title">In-house Pharmacy spatial proof</h2>
  <div class="or-art-wrap">
    <canvas id="pharmacy-art" class="or-art" width="960" height="1080" role="img" aria-label="Owner-approved three by three in-house Pharmacy design with a permanent dispensing counter, west-facing pharmacist, optional medicine storage and charting workstation, selectable doors, and route clearance."></canvas>
    <div id="pharmacy-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="or-controls">
    <fieldset><legend>Room immediately north of</legend><div id="pharmacy-adjacency" class="or-buttons"></div></fieldset>
    <fieldset><legend>Open doorway</legend><div class="or-row">
      <div><span class="or-label text-small">North</span><div id="pharmacy-north" class="or-buttons"></div></div>
      <div><span class="or-label text-small">South</span><div id="pharmacy-south" class="or-buttons"></div></div>
      <div><span class="or-label text-small">West</span><div id="pharmacy-west" class="or-buttons"></div></div>
      <div><span class="or-label text-small">East</span><div id="pharmacy-east" class="or-buttons"></div></div>
    </div></fieldset>
    <div class="or-options">
      <label class="form-check"><input id="pharmacy-optional" class="form-check-input" type="checkbox" checked><span class="form-check-label">Show optional wall furniture when clear</span></label>
      <label class="form-check"><input id="pharmacy-characters" class="form-check-input" type="checkbox" checked><span class="form-check-label">Pharmacist</span></label>
      <label class="form-check"><input id="pharmacy-routes" class="form-check-input" type="checkbox"><span class="form-check-label">Routes / contacts</span></label>
      <label class="form-check"><input id="pharmacy-scale" class="form-check-input" type="checkbox"><span class="form-check-label">Scale comparison</span></label>
    </div>
    <div class="or-note text-small"><strong>Owner-approved design:</strong> 3 × 3, one north-up orientation, at the established 120 px tile scale. Runtime integration remains unapproved.</div>
    <div id="pharmacy-status" class="or-status text-small" role="status" aria-live="polite"></div>
  </div>
  <div id="pharmacy-scale-wrap" class="or-scale-wrap" hidden>
    <strong>Same-scale fixture check</strong>
    <canvas id="pharmacy-scale-art" class="or-scale" width="1600" height="520" role="img" aria-label="Approved Front Desk, Laboratory testing bench, Pharmacy counter, and charting workstation at the same 120 pixel tile scale and floor baseline."></canvas>
    <div class="or-scale-labels text-small" aria-hidden="true"><span>Front Desk</span><span>Lab bench</span><span>Pharmacy</span><span>Computer</span></div>
  </div>
