<section id="laboratory-proof" aria-labelledby="laboratory-title">
  <style>
    #laboratory-proof{max-width:920px;margin-inline:auto}#laboratory-proof *{box-sizing:border-box}
    #laboratory-proof .or-art-wrap{position:relative;max-width:480px;margin:12px auto 0}
    #laboratory-proof .or-art{position:relative;z-index:1;display:block;width:100%;height:auto}
    #laboratory-proof .or-hit{position:absolute;z-index:2;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}
    #laboratory-proof .or-controls{max-width:480px;margin:10px auto 0}
    #laboratory-proof fieldset{border:0;margin:0 0 9px;padding:0}#laboratory-proof legend{font-weight:500;margin-bottom:4px}
    #laboratory-proof .or-buttons{display:flex;gap:4px;flex-wrap:wrap}#laboratory-proof .or-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-items:start}
    #laboratory-proof .or-label{color:var(--muted-foreground,#6b7280);display:block;margin-bottom:3px}
    #laboratory-proof .or-options{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0}
    #laboratory-proof .or-status{margin-top:8px;border-left:3px solid var(--primary,#52756d);padding-left:10px;min-height:3em}
    #laboratory-proof .or-note{margin-top:6px;color:var(--muted-foreground,#6b7280)}
    #laboratory-proof .or-scale-wrap{max-width:720px;margin:10px auto 0}
    #laboratory-proof .or-scale{display:block;width:100%;height:auto;background:#aebfc0}
    #laboratory-proof .or-scale-labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin-top:4px}
    @media(max-width:560px){#laboratory-proof .or-row{grid-template-columns:1fr}#laboratory-proof .or-options{display:grid;grid-template-columns:1fr}}
  </style>
  <h2 id="laboratory-title">In-house Laboratory spatial proof</h2>
  <div class="or-art-wrap">
    <canvas id="laboratory-art" class="or-art" width="960" height="1080" role="img" aria-label="Owner-approved three by three in-house laboratory design with a central testing bench, microscope, compact analyzer, specimen racks, north-facing technician, optional north-wall fixtures, selectable doors, and route clearance."></canvas>
    <div id="laboratory-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="or-controls">
    <fieldset><legend>Room immediately north of</legend><div id="laboratory-adjacency" class="or-buttons"></div></fieldset>
    <fieldset><legend>Open doorway</legend><div class="or-row">
      <div><span class="or-label text-small">North</span><div id="laboratory-north" class="or-buttons"></div></div>
      <div><span class="or-label text-small">South</span><div id="laboratory-south" class="or-buttons"></div></div>
      <div><span class="or-label text-small">West</span><div id="laboratory-west" class="or-buttons"></div></div>
      <div><span class="or-label text-small">East</span><div id="laboratory-east" class="or-buttons"></div></div>
    </div></fieldset>
    <div class="or-options">
      <label class="form-check"><input id="laboratory-optional" class="form-check-input" type="checkbox" checked><span class="form-check-label">Show optional wall furniture when clear</span></label>
      <label class="form-check"><input id="laboratory-characters" class="form-check-input" type="checkbox" checked><span class="form-check-label">Laboratory technician</span></label>
      <label class="form-check"><input id="laboratory-routes" class="form-check-input" type="checkbox"><span class="form-check-label">Routes / contacts</span></label>
      <label class="form-check"><input id="laboratory-scale" class="form-check-input" type="checkbox"><span class="form-check-label">Scale comparison</span></label>
    </div>
    <div class="or-note text-small"><strong>Owner-approved design:</strong> 3 × 3, one north-up orientation, at the established 120 px tile scale. Runtime integration remains unapproved.</div>
    <div id="laboratory-status" class="or-status text-small" role="status" aria-live="polite"></div>
  </div>
  <div id="laboratory-scale-wrap" class="or-scale-wrap" hidden>
    <strong>Same-scale fixture check</strong>

    <div class="or-scale-labels text-small" aria-hidden="true"><span>Front Desk</span><span>Lab bench</span><span>Pharmacy</span><span>Computer</span></div>
  </div>
