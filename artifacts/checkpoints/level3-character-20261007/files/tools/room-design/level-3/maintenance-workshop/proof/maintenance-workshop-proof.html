<section id="workshop-proof" aria-labelledby="workshop-title">
  <style>
    #workshop-proof{max-width:920px;margin-inline:auto}#workshop-proof *{box-sizing:border-box}
    #workshop-proof .or-art-wrap{position:relative;max-width:480px;margin:12px auto 0}
    #workshop-proof .or-art{position:relative;z-index:1;display:block;width:100%;height:auto}
    #workshop-proof .or-hit{position:absolute;z-index:2;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}
    #workshop-proof .or-controls{max-width:480px;margin:10px auto 0}
    #workshop-proof fieldset{border:0;margin:0 0 9px;padding:0}#workshop-proof legend{font-weight:500;margin-bottom:4px}
    #workshop-proof .or-buttons{display:flex;gap:4px;flex-wrap:wrap}#workshop-proof .or-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-items:start}
    #workshop-proof .or-label{color:var(--muted-foreground,#6b7280);display:block;margin-bottom:3px}
    #workshop-proof .or-options{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0}
    #workshop-proof .or-status{margin-top:8px;border-left:3px solid var(--primary,#52756d);padding-left:10px;min-height:3em}
    #workshop-proof .or-note{margin-top:6px;color:var(--muted-foreground,#6b7280)}
    #workshop-proof .or-scale-wrap{max-width:720px;margin:10px auto 0}
    #workshop-proof .or-scale{display:block;width:100%;height:auto;background:#aebfc0}
    #workshop-proof .or-scale-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;margin-top:4px}
    @media(max-width:560px){#workshop-proof .or-row{grid-template-columns:1fr}#workshop-proof .or-options{display:grid;grid-template-columns:1fr}}
  </style>
  <h2 id="workshop-title">In-house Maintenance Workshop spatial proof</h2>
  <div class="or-art-wrap">
    <canvas id="workshop-art" class="or-art" width="960" height="1080" role="img" aria-label="Owner-approved three by three Maintenance Workshop with a permanent repair bench, north-facing Repair Person, optional parts storage, wall tool pegboard, locked cupboard, sealed poured-concrete floor, selectable doors, and route clearance."></canvas>
    <div id="workshop-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="or-controls">

    <div class="or-note text-small"><strong>Owner-approved design:</strong> 3 × 3, one north-up orientation, at the established 120 px tile scale. Runtime integration remains separate.</div>
