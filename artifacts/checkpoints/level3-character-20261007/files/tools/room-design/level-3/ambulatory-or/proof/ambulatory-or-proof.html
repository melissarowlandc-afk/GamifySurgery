<section id="ambulatory-or-proof" aria-labelledby="ambulatory-or-title">
  <style>
    #ambulatory-or-proof{max-width:920px;margin-inline:auto}#ambulatory-or-proof *{box-sizing:border-box}
    #ambulatory-or-proof .or-art-wrap{position:relative;max-width:600px;margin:12px auto 0}
    #ambulatory-or-proof .or-art{position:relative;z-index:1;display:block;width:100%;height:auto}
    #ambulatory-or-proof .or-hit{position:absolute;z-index:2;padding:0;min-width:0;min-height:0;border:0;background:transparent;color:transparent}
    #ambulatory-or-proof .or-controls{max-width:600px;margin:10px auto 0}
    #ambulatory-or-proof fieldset{border:0;margin:0 0 9px;padding:0}#ambulatory-or-proof legend{font-weight:500;margin-bottom:4px}
    #ambulatory-or-proof .or-buttons{display:flex;gap:4px;flex-wrap:wrap}#ambulatory-or-proof .or-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-items:start}
    #ambulatory-or-proof .or-label{color:var(--muted-foreground,#6b7280);display:block;margin-bottom:3px}
    #ambulatory-or-proof .or-options{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0}
    #ambulatory-or-proof .or-status{margin-top:8px;border-left:3px solid var(--primary,#52756d);padding-left:10px;min-height:3em}
    #ambulatory-or-proof .or-note{margin-top:6px;color:var(--muted-foreground,#6b7280)}
    #ambulatory-or-proof .or-scale-wrap{max-width:720px;margin:10px auto 0}
    #ambulatory-or-proof .or-scale{display:block;width:100%;height:auto;background:#46545c}
    #ambulatory-or-proof .or-scale-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;margin-top:4px}
    @media(max-width:560px){#ambulatory-or-proof .or-row{grid-template-columns:1fr}#ambulatory-or-proof .or-options{display:grid;grid-template-columns:1fr}}
  </style>
  <h2 id="ambulatory-or-title">Ambulatory OR spatial proof</h2>
  <div class="or-art-wrap">
    <canvas id="ambulatory-or-art" class="or-art" width="1200" height="1320" role="img" aria-label="Provisional four by four ambulatory operating room with a central north-headed table, anesthesia equipment, surgical lights, instrument tray, two cardinal staff, selectable doors, and route clearance."></canvas>
    <div id="ambulatory-or-targets" aria-label="Direct wall door targets"></div>
  </div>
  <div class="or-controls">
    <fieldset><legend>Room immediately north of</legend><div id="ambulatory-or-adjacency" class="or-buttons"></div></fieldset>
    <fieldset><legend>Open doorway</legend><div class="or-row">
      <div><span class="or-label text-small">North</span><div id="ambulatory-or-north" class="or-buttons"></div></div>
      <div><span class="or-label text-small">South</span><div id="ambulatory-or-south" class="or-buttons"></div></div>
      <div><span class="or-label text-small">West</span><div id="ambulatory-or-west" class="or-buttons"></div></div>
      <div><span class="or-label text-small">East</span><div id="ambulatory-or-east" class="or-buttons"></div></div>
    </div></fieldset>
    <div class="or-options">
      <label class="form-check"><input id="ambulatory-or-occupied" class="form-check-input" type="checkbox"><span class="form-check-label">During surgery (replace empty table)</span></label>
      <label class="form-check"><input id="ambulatory-or-optional" class="form-check-input" type="checkbox" checked><span class="form-check-label">Show optional wall furniture when clear</span></label>
      <label class="form-check"><input id="ambulatory-or-characters" class="form-check-input" type="checkbox" checked><span class="form-check-label">Characters</span></label>
      <label class="form-check"><input id="ambulatory-or-routes" class="form-check-input" type="checkbox"><span class="form-check-label">Routes / contacts</span></label>
      <label class="form-check"><input id="ambulatory-or-scale" class="form-check-input" type="checkbox"><span class="form-check-label">Scale comparison</span></label>
    </div>
    <div class="or-note text-small"><strong>Provisional:</strong> 4 × 4, one north-headed orientation, at the established 120 px tile scale.</div>
    <div id="ambulatory-or-status" class="or-status text-small" role="status" aria-live="polite"></div>
  </div>

    <div class="or-scale-labels text-small" aria-hidden="true"><span>OR table + current staff</span><span>Endoscopy table</span><span>Recovery bed</span></div>
