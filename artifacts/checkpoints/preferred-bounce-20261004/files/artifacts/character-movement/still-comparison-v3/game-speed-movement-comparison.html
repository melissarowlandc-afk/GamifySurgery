<div id="still-motion-comparison" aria-labelledby="still-motion-title">
  <style>
    #still-motion-comparison{color:var(--foreground);font:inherit}
    #still-motion-comparison .smc-head,#still-motion-comparison .smc-controls,#still-motion-comparison .smc-labels{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
    #still-motion-comparison .smc-controls{margin-top:.75rem}
    #still-motion-comparison h2{margin:0;font-weight:500}
    #still-motion-comparison .smc-stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
    #still-motion-comparison .smc-lane{min-width:0}
    #still-motion-comparison .smc-labels{display:block;min-height:3.4rem;margin-bottom:.35rem}
    #still-motion-comparison .smc-labels strong{font-weight:500}
    #still-motion-comparison .smc-track{position:relative;height:248px;overflow:hidden;background:color-mix(in srgb,var(--muted) 36%,transparent)}
    #still-motion-comparison .smc-grid{position:absolute;inset:0;background-image:linear-gradient(90deg,var(--border) 1px,transparent 1px),linear-gradient(0deg,var(--border) 1px,transparent 1px);opacity:.55}
    #still-motion-comparison .smc-floor{position:absolute;left:0;right:0;bottom:24px;border-top:1px solid var(--foreground);opacity:.7}
    #still-motion-comparison .smc-shadow{position:absolute;bottom:18px;width:26px;height:7px;border-radius:50%;background:var(--foreground);opacity:.18;transform:translateX(-50%)}
    #still-motion-comparison .smc-sprite{position:absolute;object-fit:contain;transform-origin:50% 89.6875%;image-rendering:auto}
    #still-motion-comparison .smc-note{margin:.45rem 0 0;color:var(--muted-foreground)}
    #still-motion-comparison .smc-status{margin-left:auto;color:var(--muted-foreground)}
    @media(max-width:580px){#still-motion-comparison .smc-stage{grid-template-columns:1fr}#still-motion-comparison .smc-status{margin-left:0}}
  </style>
  <div class="smc-head"><h2 id="still-motion-title">Game-speed movement comparison</h2><span class="smc-status" aria-live="polite" data-status>Travel</span></div>
  <div class="viz-controls smc-controls" aria-label="Preview controls"><button type="button" class="btn btn-primary" data-toggle aria-pressed="true">Pause</button></div>
  <p class="smc-note text-small">1× game speed · 2 tiles/s · each grid square is 1 tile</p>
  <div class="smc-stage" data-stage role="group" aria-label="Two synchronized game-scale still-character movement previews">
    <section class="smc-lane" data-kind="current"><div class="smc-labels"><strong>Current</strong><br><span class="text-muted">3 px · 2 Hz · no sway · snap stop</span></div><div class="smc-track"><div class="smc-grid" aria-hidden="true"></div><div class="smc-floor" aria-hidden="true"></div><div class="smc-shadow" aria-hidden="true"></div><img class="smc-sprite" alt="Blue Glasses character with current 3 pixel bounce"></div></section>
    <section class="smc-lane" data-kind="preferred"><div class="smc-labels"><strong>Preferred</strong><br><span class="text-muted">7 px · 2 Hz · north/south sway · 120 ms settle</span></div><div class="smc-track"><div class="smc-grid" aria-hidden="true"></div><div class="smc-floor" aria-hidden="true"></div><div class="smc-shadow" aria-hidden="true"></div><img class="smc-sprite" alt="Blue Glasses character with preferred 7 pixel bounce and north-south sway"></div></section>
  </div>
