          line(`gs012-fit-shoe ${identity}`, j.ankle, contactCenter, offset, `data-side="${side}" data-segment="ankle-to-sole"`) +
          line(`gs012-fit-shoe ${identity}`, heelCenter, toeCenter, offset, `data-side="${side}" data-segment="sole"`) +
          line(`gs012-fit-arm ${identity}`, j.shoulder, j.elbow, offset, `data-side="${side}" data-segment="upper-arm"`) +
          line(`gs012-fit-arm ${identity}`, j.elbow, j.wrist, offset, `data-side="${side}" data-segment="forearm"`) +
          line(`gs012-fit-arm ${identity}`, j.wrist, j.hand, offset, `data-side="${side}" data-segment="hand"`);
      };
      const drawBody = (geometry, offset) => {
        const t = geometry.torso, h = geometry.headEnvelope, direction = geometry.facingVectorX;
        const points = [t.shoulderBack, t.shoulderFront, t.chestFront, t.hipFront, t.hipBack, t.chestBack].map(point => translate(point, offset));
        const center = translate(h.center, offset);
        const neckTop = { x: h.center.x, y: h.center.y + h.radiusY - 1 };
        const neckBottom = { x: 64, y: t.shoulderFront.y };
        const noseTop = { x: h.center.x + direction * (h.radiusX - 5), y: h.center.y - 4 };
        const noseTip = { x: h.center.x + direction * h.radiusX, y: h.center.y + 1 };
        const noseBottom = { x: h.center.x + direction * (h.radiusX - 5), y: h.center.y + 6 };
        const nt = translate(noseTop, offset), np = translate(noseTip, offset), nb = translate(noseBottom, offset);
        return line('gs012-fit-neck', neckTop, neckBottom, offset) +
          `<path class="gs012-fit-torso" d="M ${points.map(q => `${q.x} ${q.y}`).join(' L ')} Z"/>` +
          `<ellipse class="gs012-fit-head-shape" cx="${center.x}" cy="${center.y}" rx="${h.radiusX}" ry="${h.radiusY}"/>` +
          `<path class="gs012-fit-head-shape" d="M ${nt.x} ${nt.y} L ${np.x} ${np.y} L ${nb.x} ${nb.y}"/>`;
      };
      const draw = svg => {
        const width = Math.max(260, Math.round(svg.parentElement.getBoundingClientRect().width || 260));
        const geometry = phases[index][svg.dataset.view];
        const offset = (width - rig.frame.width) / 2;
        const far = geometry.farSide, near = geometry.nearSide;
        svg.setAttribute('viewBox', `0 0 ${width} 192`);
        svg.setAttribute('aria-label', `Patient 01 ${geometry.facing}-facing pose ${index + 1}: ${phases[index].label}`);
        svg.innerHTML = `<title>${geometry.facing} · ${phases[index].label}</title>` +
          '<desc>Patient 01 proportion-fitting vector guide. Left limbs are solid and right limbs are dashed.</desc>' +
          line('gs012-fit-ground', { x: 0, y: rig.frame.floorEdgeY }, { x: rig.frame.width, y: rig.frame.floorEdgeY }, offset) +
          drawSide(geometry, far, offset) + drawBody(geometry, offset) + drawSide(geometry, near, offset);
        svg.__gs012Geometry = geometry;
      };
      const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
      let wantsPlayback = !motionPreference.matches, pageVisible = !document.hidden, onScreen = true, timer;
      const phaseOutput = root.querySelector('[data-phase]'), detail = root.querySelector('[data-detail]');
      const play = root.querySelector('[data-action="play"]'), manualStatus = root.querySelector('[data-manual-status]');
      const canRun = () => wantsPlayback && pageVisible && onScreen;
      const syncTimer = () => {
        clearInterval(timer); timer = undefined;
        if (canRun()) timer = setInterval(() => { index = (index + 1) % phases.length; render(false); }, 180);
      };
      const render = (manual = false) => {
        root.dataset.currentPose = String(index + 1);
        root.dataset.playing = String(canRun());
        phaseOutput.textContent = `Pose ${index + 1} / 8 · ${phases[index].label}`;
        detail.textContent = phases[index].detail;
        root.querySelectorAll('svg[data-view]').forEach(draw);
        play.textContent = wantsPlayback ? 'Pause' : 'Play';
        play.setAttribute('aria-pressed', String(wantsPlayback));
        if (manual) manualStatus.textContent = `Pose ${index + 1} of 8, ${phases[index].label}.`;
      };
      const setPose = (next, manual = true) => {
        wantsPlayback = false; index = (next + phases.length) % phases.length; syncTimer(); render(manual);
      };
      root.querySelector('[data-action="previous"]').addEventListener('click', () => setPose(index - 1));
      root.querySelector('[data-action="next"]').addEventListener('click', () => setPose(index + 1));
      play.addEventListener('click', () => {
        wantsPlayback = !wantsPlayback; syncTimer(); render(false);
        manualStatus.textContent = wantsPlayback ? 'Walk cycle playing.' : 'Walk cycle paused.';
      });
      document.addEventListener('visibilitychange', () => { pageVisible = !document.hidden; syncTimer(); render(false); });
      motionPreference.addEventListener('change', event => {
        if (!event.matches) return;
        wantsPlayback = false; syncTimer(); render(false);
      });
      if ('IntersectionObserver' in window) new IntersectionObserver(entries => {
        onScreen = entries[0]?.isIntersecting ?? true; syncTimer(); render(false);
      }, { threshold: .01 }).observe(root);
      if ('ResizeObserver' in window) new ResizeObserver(() => render(false)).observe(root.querySelector('.gs012-fit-views'));
      root.__patient01Fit = {
        phases, rig,
        distance: (a, b) => Math.hypot(b.x - a.x, b.y - a.y),
        getState: () => ({ index, wantsPlayback, pageVisible, onScreen, running: Boolean(timer) }),
        setPose
      };
      render(false); syncTimer();
    })();
  </script>
</section>
